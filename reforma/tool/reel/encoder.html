<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reforma reel encoder</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; background: #f3eef6; color: #1f2a30; }
  #log { white-space: pre-wrap; }
  progress { width: 420px; }
</style>
</head>
<body>
<h3>Reforma reel encoder</h3>
<p>Encodes the PNG frames from <code>render_reel_test.dart</code> to H.264 + AAC MP4 (WebCodecs), with a synthesized soundtrack timed to the script's cues.</p>
<button id="go">Encode</button> <progress id="bar" max="1" value="0"></progress>
<div id="log"></div>
<script>
// Size and file name come from the render's events.json.
let W = 1920, H = 1440, NAME = 'Reforma-Showcase-30s.mp4';
const FPS = 60;
const log = (m) => { document.getElementById('log').textContent += m + '\n'; console.log(m); };
const bar = document.getElementById('bar');

// ---------------------------------------------------------------- soundtrack
async function soundtrack(length, cues) {
  const SR = 48000;
  const ctx = new OfflineAudioContext(2, Math.ceil(SR * length), SR);
  const master = ctx.createGain();
  master.gain.setValueAtTime(0, 0);
  master.gain.linearRampToValueAtTime(0.9, 1.0);
  master.gain.setValueAtTime(0.9, length - 1.6);
  master.gain.linearRampToValueAtTime(0, length);
  master.connect(ctx.destination);

  // Soft room: convolver with a generated decaying-noise impulse.
  const ir = ctx.createBuffer(2, SR * 3, SR);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3.2);
  }
  const verb = ctx.createConvolver(); verb.buffer = ir;
  const wet = ctx.createGain(); wet.gain.value = 0.32;
  verb.connect(wet).connect(master);
  const bus = ctx.createGain(); bus.connect(master); bus.connect(verb);

  const noise = ctx.createBuffer(1, SR * 2, SR);
  { const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function tone(freq, t, dur, gain, { type = 'sine', attack = 0.004, pan = 0, detune = 0, out = bus } = {}) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = freq; o.detune.value = detune;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const p = ctx.createStereoPanner(); p.pan.value = pan;
    o.connect(g).connect(p).connect(out);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function whoosh(t, dur, f0, f1, gain) {
    const s = ctx.createBufferSource(); s.buffer = noise;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
    bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + dur * 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp).connect(g).connect(bus);
    s.start(t); s.stop(t + dur + 0.05);
  }

  // Ambient pad: four chords, 7.5 s each, detuned sine/triangle through a lowpass.
  const chords = [[53, 57, 60, 64, 67], [57, 60, 64, 67, 71], [50, 57, 62, 65, 69], [46, 58, 62, 65, 69]];
  const padLp = ctx.createBiquadFilter(); padLp.type = 'lowpass'; padLp.frequency.value = 1500; padLp.connect(bus);
  const span = length / chords.length;
  chords.forEach((ch, i) => {
    const t0 = i * span, t1 = t0 + span;
    ch.forEach((m, v) => {
      for (const [type, det] of [['sine', -5], ['triangle', 5]]) {
        const o = ctx.createOscillator(); o.type = type; o.frequency.value = hz(m); o.detune.value = det;
        const g = ctx.createGain();
        const peak = (type === 'sine' ? 0.03 : 0.012) * (v === 0 ? 1.2 : 1);
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(peak, t0 + 1.6);
        g.gain.setValueAtTime(peak, t1 - 0.4);
        g.gain.linearRampToValueAtTime(0, t1 + 1.8);
        const p = ctx.createStereoPanner(); p.pan.value = (v - 2) * 0.18;
        o.connect(g).connect(p).connect(padLp);
        o.start(t0); o.stop(t1 + 2);
      }
    });
    tone(hz(ch[0] - 12), t0, span + 1.5, 0.06, { attack: 1.2 });
    // Gentle bell arpeggio over the chord.
    const beat = 60 / 96;
    for (let k = 0; k * beat < span - 0.2; k++) {
      if (k % 4 === 3) continue;
      const m = ch[(k * 2 + i) % ch.length] + 12;
      tone(hz(m), t0 + k * beat, 1.6, 0.022, { pan: k % 2 ? 0.35 : -0.35 });
      tone(hz(m) * 2.01, t0 + k * beat, 0.6, 0.006, { pan: k % 2 ? 0.35 : -0.35 });
    }
  });

  // UI sound design at the script's cue times.
  for (const { t, kind } of cues) {
    switch (kind) {
      case 'tap':
        tone(1750, t, 0.07, 0.07); tone(3500, t, 0.03, 0.02);
        break;
      case 'tick':
        tone(2093, t, 0.18, 0.06); tone(2637, t + 0.05, 0.22, 0.05);
        break;
      case 'success':
        tone(1318.5, t, 0.7, 0.07); tone(1975.5, t + 0.09, 0.9, 0.06); tone(2637, t + 0.18, 0.8, 0.03);
        break;
      case 'whoosh':
        tone(1750, t, 0.06, 0.05); whoosh(t + 0.02, 0.55, 320, 2600, 0.16);
        break;
      case 'spin':
        whoosh(t - 0.3, 1.2, 2400, 420, 0.14);
        break;
      case 'rise':
        whoosh(t, 0.9, 180, 1100, 0.12);
        break;
      case 'intro':
      case 'outro':
        for (const [f, d] of [[880, 0], [1318.5, 0.07], [1760, 0.14]]) tone(f, t + d, 2.8, 0.035, { attack: 0.01 });
        break;
    }
  }
  const out = await ctx.startRendering();
  // Peak-normalise to -2 dBFS so the mix sits at a normal listening level.
  let peak = 0;
  for (let c = 0; c < out.numberOfChannels; c++) for (const v of out.getChannelData(c)) peak = Math.max(peak, Math.abs(v));
  const k = peak > 0 ? 0.79 / peak : 1;
  for (let c = 0; c < out.numberOfChannels; c++) { const d = out.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= k; }
  return out;
}

// ---------------------------------------------------------------- MP4 muxer
// Minimal ISO-BMFF writer: one H.264 track + one AAC track, moov first.
function u8(...a) { return Uint8Array.from(a); }
function u16(v) { return u8(v >> 8 & 255, v & 255); }
function u32(v) { return u8(v >>> 24 & 255, v >> 16 & 255, v >> 8 & 255, v & 255); }
function str(s) { return Uint8Array.from([...s].map(c => c.charCodeAt(0))); }
function cat(parts) {
  const n = parts.reduce((a, p) => a + p.length, 0), out = new Uint8Array(n);
  let o = 0; for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
function box(type, ...parts) { const body = cat(parts); return cat([u32(body.length + 8), str(type), body]); }
function full(type, version, flags, ...parts) { return box(type, u8(version, flags >> 16 & 255, flags >> 8 & 255, flags & 255), ...parts); }
const matrix = cat([u32(0x10000), u32(0), u32(0), u32(0), u32(0x10000), u32(0), u32(0), u32(0), u32(0x40000000)]);

function trak({ id, handler, timescale, duration, movieDuration, width = 0, height = 0, stsd, sizes, deltas, keyframes, chunkOffset }) {
  const tkhd = full('tkhd', 0, 3, u32(0), u32(0), u32(id), u32(0), u32(movieDuration), u32(0), u32(0),
    u16(0), u16(0), u16(handler === 'soun' ? 0x0100 : 0), u16(0), matrix, u32(width << 16), u32(height << 16));
  const mdhd = full('mdhd', 0, 0, u32(0), u32(0), u32(timescale), u32(duration), u16(0x55c4), u16(0));
  const hdlr = full('hdlr', 0, 0, u32(0), str(handler), u32(0), u32(0), u32(0), str(handler === 'vide' ? 'VideoHandler\0' : 'SoundHandler\0'));
  const media = handler === 'vide' ? full('vmhd', 0, 1, u16(0), u16(0), u16(0), u16(0)) : full('smhd', 0, 0, u16(0), u16(0));
  const dinf = box('dinf', full('dref', 0, 0, u32(1), full('url ', 0, 1)));
  // stts: run-length encode the deltas.
  const runs = [];
  for (const d of deltas) { const last = runs[runs.length - 1]; if (last && last[1] === d) last[0]++; else runs.push([1, d]); }
  const stts = full('stts', 0, 0, u32(runs.length), ...runs.flatMap(([c, d]) => [u32(c), u32(d)]));
  const stss = keyframes ? full('stss', 0, 0, u32(keyframes.length), ...keyframes.map(k => u32(k + 1))) : new Uint8Array();
  const stsc = full('stsc', 0, 0, u32(1), u32(1), u32(sizes.length), u32(1));
  const stsz = full('stsz', 0, 0, u32(0), u32(sizes.length), ...sizes.map(u32));
  const stco = full('stco', 0, 0, u32(1), u32(chunkOffset));
  const stbl = box('stbl', stsd, stts, stss, stsc, stsz, stco);
  return box('trak', tkhd, box('mdia', mdhd, hdlr, box('minf', media, dinf, stbl)));
}

function avc1(avcC) {
  return full('stsd', 0, 0, u32(1), box('avc1', u8(0, 0, 0, 0, 0, 0), u16(1), u16(0), u16(0), u32(0), u32(0), u32(0),
    u16(W), u16(H), u32(0x480000), u32(0x480000), u32(0), u16(1), new Uint8Array(32), u16(0x18), u16(0xffff),
    box('avcC', avcC)));
}
function mp4a(asc, bitrate) {
  const desc = (tag, body) => cat([u8(tag, body.length), body]);
  const dsi = desc(0x05, asc);
  const dcd = desc(0x04, cat([u8(0x40, 0x15, 0, 0, 0), u32(bitrate), u32(bitrate), dsi]));
  const esd = desc(0x03, cat([u16(2), u8(0), dcd, desc(0x06, u8(0x02))]));
  return full('stsd', 0, 0, u32(1), box('mp4a', u8(0, 0, 0, 0, 0, 0), u16(1), u32(0), u32(0), u16(2), u16(16), u16(0), u16(0),
    u32(48000 << 16), full('esds', 0, 0, esd)));
}

function mux(video, audio, abitrate) {
  const vTs = FPS * 1000, vDelta = 1000;
  const vDur = video.chunks.length * vDelta;
  const aDur = audio.chunks.length * 1024;
  const movieDur = Math.round(Math.max(vDur / vTs, aDur / 48000) * 1000);
  const vSizes = video.chunks.map(c => c.byteLength), aSizes = audio.chunks.map(c => c.byteLength);
  const keyframes = video.chunks.map((c, i) => c.type === 'key' ? i : -1).filter(i => i >= 0);
  const ftyp = box('ftyp', str('isom'), u32(512), str('isom'), str('iso2'), str('avc1'), str('mp41'));
  const build = (vOff, aOff) => box('moov',
    full('mvhd', 0, 0, u32(0), u32(0), u32(1000), u32(movieDur), u32(0x10000), u16(0x0100), u16(0), u32(0), u32(0),
      matrix, new Uint8Array(24), u32(3)),
    trak({ id: 1, handler: 'vide', timescale: vTs, duration: vDur, movieDuration: movieDur, width: W, height: H,
      stsd: avc1(video.description), sizes: vSizes, deltas: vSizes.map(() => vDelta), keyframes, chunkOffset: vOff }),
    trak({ id: 2, handler: 'soun', timescale: 48000, duration: aDur, movieDuration: movieDur,
      stsd: mp4a(audio.description, abitrate), sizes: aSizes, deltas: aSizes.map(() => 1024), chunkOffset: aOff }));
  const moovSize = build(0, 0).length;
  const vBytes = vSizes.reduce((a, b) => a + b, 0);
  const mdatStart = ftyp.length + moovSize + 8;
  const moov = build(mdatStart, mdatStart + vBytes);
  const mdatLen = 8 + vBytes + aSizes.reduce((a, b) => a + b, 0);
  return new Blob([ftyp, moov, u32(mdatLen), str('mdat'), ...video.chunks.map(c => c.data), ...audio.chunks.map(c => c.data)], { type: 'video/mp4' });
}

// ---------------------------------------------------------------- encode
async function encodeVideo(count) {
  const chunks = [];
  let description = null;
  const enc = new VideoEncoder({
    output: (chunk, meta) => {
      if (meta && meta.decoderConfig && meta.decoderConfig.description) description = new Uint8Array(meta.decoderConfig.description);
      const data = new Uint8Array(chunk.byteLength); chunk.copyTo(data);
      chunks.push({ data, byteLength: chunk.byteLength, type: chunk.type, ts: chunk.timestamp });
    },
    error: (e) => log('video error: ' + e.message),
  });
  enc.configure({
    codec: 'avc1.640033', width: W, height: H, framerate: FPS,
    bitrate: 22_000_000, bitrateMode: 'variable', latencyMode: 'quality',
    hardwareAcceleration: 'prefer-software', avc: { format: 'avc' },
  });
  const load = async (i) => createImageBitmap(await (await fetch('/frames/' + String(i).padStart(5, '0') + '.png')).blob());
  const ahead = [];
  for (let i = 0; i < Math.min(6, count); i++) ahead.push(load(i));
  for (let i = 0; i < count; i++) {
    const bmp = await ahead.shift();
    if (i + 6 < count) ahead.push(load(i + 6));
    const frame = new VideoFrame(bmp, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    while (enc.encodeQueueSize > 8) await new Promise(r => enc.addEventListener('dequeue', r, { once: true }));
    enc.encode(frame, { keyFrame: i % FPS === 0 });
    frame.close(); bmp.close();
    if (i % 30 === 0) { bar.value = i / count * 0.9; log('video ' + i + '/' + count); }
  }
  await enc.flush();
  // B-frames would need ctts: verify presentation order == decode order.
  for (let i = 1; i < chunks.length; i++) if (chunks[i].ts < chunks[i - 1].ts) throw new Error('encoder reordered frames');
  return { chunks, description };
}

async function encodeAudio(buffer, bitrate) {
  const chunks = [];
  let description = null;
  const enc = new AudioEncoder({
    output: (chunk, meta) => {
      if (meta && meta.decoderConfig && meta.decoderConfig.description) description = new Uint8Array(meta.decoderConfig.description);
      const data = new Uint8Array(chunk.byteLength); chunk.copyTo(data);
      chunks.push({ data, byteLength: chunk.byteLength });
    },
    error: (e) => log('audio error: ' + e.message),
  });
  enc.configure({ codec: 'mp4a.40.2', sampleRate: 48000, numberOfChannels: 2, bitrate });
  const L = buffer.getChannelData(0), R = buffer.getChannelData(1), N = 1024;
  for (let off = 0; off < buffer.length; off += N) {
    const n = Math.min(N, buffer.length - off);
    const data = new Float32Array(n * 2);
    data.set(L.subarray(off, off + n), 0); data.set(R.subarray(off, off + n), n);
    enc.encode(new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(off * 1e6 / 48000), data }));
  }
  await enc.flush();
  if (!description) description = u8(0x11, 0x90); // AAC-LC, 48 kHz, stereo
  return { chunks, description };
}

async function run() {
  const t0 = performance.now();
  const { frames } = await (await fetch('/info')).json();
  const meta = await (await fetch('/frames/events.json')).json();
  W = meta.width || W; H = meta.height || H; NAME = meta.name || NAME;
  log('frames: ' + frames + ', cues: ' + meta.events.length + ', ' + W + '×' + H + ' → ' + NAME);
  const video = await encodeVideo(frames);
  log('video chunks: ' + video.chunks.length);
  const music = await soundtrack(meta.length, meta.events);
  const audio = await encodeAudio(music, 192_000);
  log('audio chunks: ' + audio.chunks.length);
  const blob = mux(video, audio, 192_000);
  bar.value = 0.97;
  const res = await fetch('/save?name=' + NAME, { method: 'POST', body: blob });
  bar.value = 1;
  const msg = 'saved ' + (await res.text()) + ' — ' + (blob.size / 1e6).toFixed(1) + ' MB in ' + ((performance.now() - t0) / 1000).toFixed(0) + ' s';
  log(msg);
  window.__done = msg;
  return msg;
}
document.getElementById('go').onclick = () => run().catch(e => { log('FAILED: ' + e.message); window.__done = 'FAILED: ' + e.message; });
window.run = run;
</script>
</body>
</html>
